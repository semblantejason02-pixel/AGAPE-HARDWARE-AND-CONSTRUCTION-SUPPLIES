<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGAPE Hardware - Seller</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

.login-box h1 {
    text-align: center;
    margin-top: 0;
    color: #d97706;
}

.login-box p {
    text-align: center;
    color: #777;
}

/* INPUTS */

input,
textarea,
select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14px;
}

.btn-primary {
    background: #d97706;
    color: white;
}

.btn-primary:hover {
    background: #b45309;
}

.btn-secondary {
    background: #374151;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-warning {
    background: #f59e0b;
    color: white;
}

/* SELLER APP */

.seller-app {
    display: none;
}

.header {
    background: #111827;
    color: white;
    padding: 14px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-title h1 {
    margin: 0;
    font-size: 22px;
}

.header-title span {
    color: #f59e0b;
}

/* NAVIGATION */

.nav {
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    gap: 5px;
    padding: 10px 25px;
    overflow-x: auto;
}

.nav button {
    background: transparent;
    color: #374151;
    white-space: nowrap;
}

.nav button:hover,
.nav button.active {
    background: #d97706;
    color: white;
}

/* MAIN */

.main {
    width: 100%;
    max-width: 1900px;
    margin: auto;
    padding: 25px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.section-title h2 {
    margin: 0;
}

/* DASHBOARD */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
    border-left: 5px solid #d97706;
}

.stat-card h3 {
    margin: 0 0 10px;
    color: #666;
    font-size: 14px;
}

.stat-number {
    font-size: 32px;
    font-weight: bold;
}

/* PRODUCTS */

.product-category-section {
    margin-bottom: 35px;
}

.product-category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #d97706;
}

.product-category-header h3 {
    margin: 0;
    font-size: 22px;
    color: #111827;
}

.product-category-count {
    background: #fef3c7;
    color: #92400e;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

.category-products-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
}

.product-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
}

.product-image,
.product-no-image {
    width: 100%;
    height: 210px;
}

.product-image {
    object-fit: contain;
    background: #f9fafb;
    padding: 12px;
}

.product-no-image {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5e7eb;
    color: #777;
}

.product-content {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.product-brand {
    color: #d97706;
    font-size: 13px;
    font-weight: bold;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
    margin: 5px 0 8px;
}

.product-description {
    color: #666;
    font-size: 13px;
    line-height: 1.4;
    margin-bottom: 12px;
}

.product-info {
    margin-top: auto;
}

.product-price {
    font-size: 20px;
    font-weight: bold;
}

.product-stock {
    font-size: 13px;
    margin: 5px 0 12px;
}

.low-stock {
    color: #dc2626;
    font-weight: bold;
}

.normal-stock {
    color: #16a34a;
}

.product-actions {
    display: flex;
    gap: 8px;
}

.product-actions button {
    flex: 1;
}

/* PRODUCT FORM */

.form-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    max-width: 900px;
    margin: auto;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 6px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-buttons {
    display: flex;
    gap: 10px;
}

/* ORDER TABS */

.order-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: white;
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 2px 7px rgba(0,0,0,.06);
}

.order-tab {
    background: #f3f4f6;
    color: #374151;
    font-weight: bold;
}

.order-tab.active {
    background: #d97706;
    color: white;
}

.order-count {
    display: inline-block;
    min-width: 22px;
    padding: 2px 6px;
    margin-left: 5px;
    border-radius: 12px;
    background: rgba(255,255,255,.25);
}

/* ORDERS */

.orders-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
}

.order-card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
}

.order-number {
    font-size: 18px;
    font-weight: bold;
}

.status {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
}

.status-confirmed {
    background: #dbeafe;
    color: #1d4ed8;
}

.status-completed {
    background: #dcfce7;
    color: #166534;
}

.status-cancelled {
    background: #fee2e2;
    color: #991b1b;
}

.order-info {
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 12px;
}

.order-items {
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    padding: 12px 0;
    margin-bottom: 12px;
}

.order-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    font-size: 13px;
}

.order-total {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.order-actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
}

.order-actions button {
    font-size: 12px;
}

/* EMPTY */

.empty {
    background: white;
    padding: 50px 20px;
    text-align: center;
    border-radius: 12px;
    color: #777;
    grid-column: 1 / -1;
}

/* LARGE MONITOR */

@media (min-width: 1500px) {

    .category-products-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .orders-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
}

/* TABLET */

@media (max-width: 999px) and (min-width: 601px) {

    .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .orders-grid,
    .category-products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

/* PHONE */

@media (max-width: 600px) {

    .header {
        padding: 12px 15px;
    }

    .header-title h1 {
        font-size: 17px;
    }

    .main {
        padding: 15px;
    }

    .nav {
        padding: 8px 12px;
    }

    .dashboard-grid,
    .orders-grid,
    .category-products-grid {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .section-title {
        flex-direction: column;
        align-items: flex-start;
    }

    .order-tabs {
        overflow-x: auto;
    }

    .order-tab {
        white-space: nowrap;
    }

    .product-category-header {
        align-items: center;
    }

    .product-category-header h3 {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-container">

    <div class="login-box">

        <h1>AGAPE HARDWARE</h1>

        <p>Seller / Admin Login</p>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button
            class="btn-primary"
            style="width:100%;"
            onclick="login()"
        >
            Login
        </button>

        <p id="loginMessage"></p>

    </div>

</div>


<!-- SELLER APP -->

<div id="sellerApp" class="seller-app">

    <div class="header">

        <div class="header-title">
            <h1>
                AGAPE <span>HARDWARE</span>
            </h1>
        </div>

        <button
            class="btn-danger"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- MAIN NAV -->

    <div class="nav">

        <button
            id="navDashboard"
            class="active"
            onclick="showSection('dashboard')"
        >
            Dashboard
        </button>

        <button
            id="navOrders"
            onclick="showSection('orders')"
        >
            Orders
        </button>

        <button
            id="navProducts"
            onclick="showSection('products')"
        >
            Products
        </button>

        <button
            id="navAddProduct"
            onclick="openAddProduct()"
        >
            + Add Product
        </button>

    </div>


    <main class="main">

        <!-- DASHBOARD -->

        <section id="dashboard" class="section active">

            <div class="section-title">

                <div>
                    <h2>Dashboard</h2>

                    <p style="color:#777;">
                        Manage your hardware store
                    </p>
                </div>

            </div>


            <div class="dashboard-grid">

                <div class="stat-card">

                    <h3>Products</h3>

                    <div
                        class="stat-number"
                        id="dashboardProducts"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <h3>Low Stock</h3>

                    <div
                        class="stat-number"
                        id="dashboardLowStock"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <h3>Total Orders</h3>

                    <div
                        class="stat-number"
                        id="dashboardOrders"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <h3>Pending Orders</h3>

                    <div
                        class="stat-number"
                        id="dashboardPending"
                    >
                        0
                    </div>

                </div>

            </div>

        </section>


        <!-- ORDERS -->

        <section id="orders" class="section">

            <div class="section-title">

                <div>

                    <h2>Customer Orders</h2>

                    <p style="color:#777;">
                        Manage incoming customer orders
                    </p>

                </div>


                <button
                    class="btn-secondary"
                    onclick="loadOrders()"
                >
                    Refresh
                </button>

            </div>


            <div class="order-tabs">

                <button
                    id="newOrdersTab"
                    class="order-tab active"
                    onclick="showOrderTab('new')"
                >
                    🆕 New Orders

                    <span
                        class="order-count"
                        id="newOrderCount"
                    >
                        0
                    </span>

                </button>


                <button
                    id="statusOrdersTab"
                    class="order-tab"
                    onclick="showOrderTab('status')"
                >
                    📦 Order Status

                    <span
                        class="order-count"
                        id="statusOrderCount"
                    >
                        0
                    </span>

                </button>

            </div>


            <div
                id="newOrdersContainer"
                class="orders-grid"
            ></div>


            <div
                id="statusOrdersContainer"
                class="orders-grid hidden"
            ></div>

        </section>


        <!-- PRODUCTS -->

        <section id="products" class="section">

            <div class="section-title">

                <div>

                    <h2>Products</h2>

                    <p style="color:#777;">
                        Manage your hardware products
                    </p>

                </div>


                <button
                    class="btn-primary"
                    onclick="openAddProduct()"
                >
                    + Add Product
                </button>

            </div>


            <div id="productsCategories"></div>

        </section>


        <!-- ADD / EDIT PRODUCT -->

        <section id="addProduct" class="section">

            <div class="section-title">

                <div>

                    <h2 id="formTitle">
                        Add Product
                    </h2>

                    <p style="color:#777;">
                        Add or update your product
                    </p>

                </div>

            </div>


            <div class="form-card">

                <input
                    type="hidden"
                    id="productId"
                >


                <div class="form-grid">

                    <div class="form-group">

                        <label>Brand</label>

                        <input
                            type="text"
                            id="brand"
                            placeholder="e.g. Boysen"
                        >

                    </div>


                    <div class="form-group">

                        <label>Product Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Product name"
                        >

                    </div>


                    <div class="form-group">

                        <label>Category</label>

                        <select id="category">

                            <option value="">
                                Select Category
                            </option>

                            <option value="Cement">
                                Cement
                            </option>

                            <option value="Steel">
                                Steel
                            </option>

                            <option value="Electrical">
                                Electrical
                            </option>

                            <option value="Plumbing">
                                Plumbing
                            </option>

                            <option value="Paint">
                                Paint
                            </option>

                            <option value="Tools">
                                Tools
                            </option>

                            <option value="Others">
                                Others
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Unit</label>

                        <input
                            type="text"
                            id="unit"
                            value="Piece"
                            placeholder="Piece, Bag, Meter..."
                        >

                    </div>


                    <div class="form-group">

                        <label>Price</label>

                        <input
                            type="number"
                            id="price"
                            step="0.01"
                            min="0"
                            placeholder="0.00"
                        >

                    </div>


                    <div class="form-group">

                        <label>Stock</label>

                        <input
                            type="number"
                            id="stock"
                            min="0"
                            placeholder="0"
                        >

                    </div>


                    <div class="form-group full">

                        <label>Description</label>

                        <textarea
                            id="description"
                            placeholder="Product description"
                        ></textarea>

                    </div>


                    <div class="form-group full">

                        <label>Product Image</label>

                        <input
                            type="file"
                            id="imageFile"
                            accept="image/*"
                        >

                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        class="btn-primary"
                        onclick="saveProduct()"
                    >
                        Save Product
                    </button>

                    <button
                        class="btn-secondary"
                        onclick="cancelEdit()"
                    >
                        Cancel
                    </button>

                </div>


                <p id="productMessage"></p>

            </div>

        </section>

    </main>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
    "https://djeqfrifhqcpfxccotdl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MAi_oJyKtuW1sM9YddWMMA_7tXcH1rP";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* LOGIN */

async function login() {

    const email =
        document.getElementById("loginEmail")
            .value.trim();

    const password =
        document.getElementById("loginPassword")
            .value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "";

    if (!email || !password) {

        message.textContent =
            "Please enter email and password.";

        return;
    }

    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        message.textContent =
            error.message;

        return;
    }

    showSellerApp();
}


/* LOGOUT */

async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("sellerApp")
        .style.display = "none";

    document.getElementById("loginPage")
        .style.display = "flex";
}


/* SESSION */

async function checkSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();

    if (session) {

        showSellerApp();

    } else {

        document.getElementById("loginPage")
            .style.display = "flex";

        document.getElementById("sellerApp")
            .style.display = "none";
    }
}


/* SHOW SELLER APP */

function showSellerApp() {

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("sellerApp")
        .style.display = "block";

    loadProducts();
    loadOrders();
}


/* MAIN NAVIGATION */

function showSection(sectionId) {

    document.querySelectorAll(".section")
        .forEach(section => {
            section.classList.remove("active");
        });

    document.getElementById(sectionId)
        .classList.add("active");


    document.querySelectorAll(".nav button")
        .forEach(button => {
            button.classList.remove("active");
        });


    if (sectionId === "dashboard") {

        document.getElementById("navDashboard")
            .classList.add("active");

    } else if (sectionId === "orders") {

        document.getElementById("navOrders")
            .classList.add("active");

        loadOrders();

    } else if (sectionId === "products") {

        document.getElementById("navProducts")
            .classList.add("active");

        loadProducts();

    } else if (sectionId === "addProduct") {

        document.getElementById("navAddProduct")
            .classList.add("active");
    }
}


function openAddProduct() {

    cancelEdit();

    showSection("addProduct");
}


/* ORDER SUB-TABS */

let currentOrderTab = "new";


function showOrderTab(tab) {

    currentOrderTab = tab;

    const newContainer =
        document.getElementById("newOrdersContainer");

    const statusContainer =
        document.getElementById("statusOrdersContainer");

    const newTab =
        document.getElementById("newOrdersTab");

    const statusTab =
        document.getElementById("statusOrdersTab");


    if (tab === "new") {

        newContainer.classList.remove("hidden");
        statusContainer.classList.add("hidden");

        newTab.classList.add("active");
        statusTab.classList.remove("active");

    } else {

        newContainer.classList.add("hidden");
        statusContainer.classList.remove("hidden");

        newTab.classList.remove("active");
        statusTab.classList.add("active");
    }
}


/* LOAD PRODUCTS */

async function loadProducts() {

    const container =
        document.getElementById("productsCategories");

    container.innerHTML =
        '<div class="empty">Loading products...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        container.innerHTML =
            `<div class="empty">
                Error loading products:<br>
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    const products = data || [];


    document.getElementById("dashboardProducts")
        .textContent = products.length;


    const lowStock =
        products.filter(
            product =>
                Number(product.stock || 0) <= 5
        ).length;


    document.getElementById("dashboardLowStock")
        .textContent = lowStock;


    if (products.length === 0) {

        container.innerHTML =
            '<div class="empty">No products yet.</div>';

        return;
    }


    const categoryOrder = [
        "Cement",
        "Steel",
        "Electrical",
        "Plumbing",
        "Paint",
        "Tools",
        "Others"
    ];


    const grouped = {};


    products.forEach(product => {

        let category =
            product.category
                ? String(product.category).trim()
                : "";

        if (!category) {
            category = "Others";
        }

        if (!grouped[category]) {
            grouped[category] = [];
        }

        grouped[category].push(product);
    });


    const categories =
        Object.keys(grouped).sort((a, b) => {

            const indexA =
                categoryOrder.indexOf(a);

            const indexB =
                categoryOrder.indexOf(b);


            if (indexA !== -1 && indexB !== -1) {
                return indexA - indexB;
            }

            if (indexA !== -1) {
                return -1;
            }

            if (indexB !== -1) {
                return 1;
            }

            return a.localeCompare(b);
        });


    container.innerHTML =
        categories.map(category => {

            const categoryProducts =
                grouped[category];


            const productsHTML =
                categoryProducts.map(product => {

                    const stock =
                        Number(product.stock || 0);

                    const stockClass =
                        stock <= 5
                            ? "low-stock"
                            : "normal-stock";


                    const imageHTML =
                        product.image
                            ? `
                                <img
                                    class="product-image"
                                    src="${escapeHtml(product.image)}"
                                    alt="${escapeHtml(product.name)}"
                                >
                              `
                            : `
                                <div class="product-no-image">
                                    No Image
                                </div>
                              `;


                    return `
                        <div class="product-card">

                            ${imageHTML}

                            <div class="product-content">

                                <div class="product-brand">
                                    ${escapeHtml(
                                        product.brand || ""
                                    )}
                                </div>

                                <div class="product-name">
                                    ${escapeHtml(
                                        product.name
                                    )}
                                </div>

                                <div class="product-description">
                                    ${escapeHtml(
                                        product.description || ""
                                    )}
                                </div>

                                <div class="product-info">

                                    <div class="product-price">
                                        ₱${Number(
                                            product.price || 0
                                        ).toLocaleString(
                                            "en-PH",
                                            {
                                                minimumFractionDigits: 2
                                            }
                                        )}
                                        /
                                        ${escapeHtml(
                                            product.unit || "Piece"
                                        )}
                                    </div>

                                    <div
                                        class="product-stock ${stockClass}"
                                    >
                                        Stock: ${stock}
                                    </div>

                                    <div class="product-actions">

                                        <button
                                            class="btn-warning"
                                            onclick="editProduct(${product.id})"
                                        >
                                            Edit
                                        </button>

                                        <button
                                            class="btn-danger"
                                            onclick="deleteProduct(${product.id})"
                                        >
                                            Delete
                                        </button>

                                    </div>

                                </div>

                            </div>

                        </div>
                    `;

                }).join("");


            return `
                <div class="product-category-section">

                    <div class="product-category-header">

                        <h3>
                            ${escapeHtml(category)}
                        </h3>

                        <span class="product-category-count">
                            ${categoryProducts.length}
                            ${
                                categoryProducts.length === 1
                                    ? "Product"
                                    : "Products"
                            }
                        </span>

                    </div>

                    <div class="category-products-grid">
                        ${productsHTML}
                    </div>

                </div>
            `;

        }).join("");
}


/* SAVE PRODUCT */

async function saveProduct() {

    const id =
        document.getElementById("productId").value;

    const brand =
        document.getElementById("brand").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const category =
        document.getElementById("category").value;

    const description =
        document.getElementById("description")
            .value.trim();

    const price =
        Number(
            document.getElementById("price").value || 0
        );

    const unit =
        document.getElementById("unit").value.trim()
        || "Piece";

    const stock =
        Number(
            document.getElementById("stock").value || 0
        );

    const file =
        document.getElementById("imageFile").files[0];

    const message =
        document.getElementById("productMessage");


    message.textContent = "";


    if (!name) {

        message.textContent =
            "Product name is required.";

        message.style.color = "#dc2626";

        return;
    }


    let image = null;


    if (file) {

        try {

            image =
                await fileToDataURL(file);

        } catch {

            message.textContent =
                "Unable to read image.";

            message.style.color = "#dc2626";

            return;
        }
    }


    const productData = {
        brand,
        name,
        category,
        description,
        price,
        unit,
        stock
    };


    if (image) {
        productData.image = image;
    }


    let result;


    if (id) {

        result =
            await supabaseClient
                .from("products")
                .update(productData)
                .eq("id", id);

    } else {

        result =
            await supabaseClient
                .from("products")
                .insert(productData);
    }


    if (result.error) {

        message.textContent =
            result.error.message;

        message.style.color = "#dc2626";

        return;
    }


    message.textContent =
        id
            ? "Product updated successfully."
            : "Product added successfully.";

    message.style.color = "#16a34a";


    await loadProducts();


    setTimeout(() => {

        cancelEdit();
        showSection("products");

    }, 700);
}


/* EDIT PRODUCT */

async function editProduct(id) {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(error.message);

        return;
    }


    document.getElementById("productId").value =
        data.id;

    document.getElementById("brand").value =
        data.brand || "";

    document.getElementById("name").value =
        data.name || "";

    document.getElementById("category").value =
        data.category || "";

    document.getElementById("description").value =
        data.description || "";

    document.getElementById("price").value =
        data.price || 0;

    document.getElementById("unit").value =
        data.unit || "Piece";

    document.getElementById("stock").value =
        data.stock || 0;

    document.getElementById("imageFile").value = "";

    document.getElementById("formTitle").textContent =
        "Edit Product";

    showSection("addProduct");
}


/* CANCEL EDIT */

function cancelEdit() {

    document.getElementById("productId").value = "";

    document.getElementById("brand").value = "";

    document.getElementById("name").value = "";

    document.getElementById("category").value = "";

    document.getElementById("description").value = "";

    document.getElementById("price").value = "";

    document.getElementById("unit").value = "Piece";

    document.getElementById("stock").value = "";

    document.getElementById("imageFile").value = "";

    document.getElementById("formTitle").textContent =
        "Add Product";

    document.getElementById("productMessage")
        .textContent = "";
}


/* DELETE PRODUCT */

async function deleteProduct(id) {

    if (!confirm(
        "Are you sure you want to delete this product?"
    )) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(error.message);

        return;
    }


    loadProducts();
}


/* LOAD ORDERS */

async function loadOrders() {

    const newContainer =
        document.getElementById("newOrdersContainer");

    const statusContainer =
        document.getElementById("statusOrdersContainer");


    newContainer.innerHTML =
        '<div class="empty">Loading new orders...</div>';

    statusContainer.innerHTML =
        '<div class="empty">Loading order status...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        newContainer.innerHTML =
            `<div class="empty">
                Error loading orders:<br>
                ${escapeHtml(error.message)}
            </div>`;

        statusContainer.innerHTML = "";

        return;
    }


    const orders = data || [];


    const newOrders =
        orders.filter(
            order =>
                String(order.status || "Pending")
                    .toLowerCase() === "pending"
        );


    const statusOrders =
        orders.filter(
            order =>
                String(order.status || "Pending")
                    .toLowerCase() !== "pending"
        );


    document.getElementById("dashboardOrders")
        .textContent = orders.length;

    document.getElementById("dashboardPending")
        .textContent = newOrders.length;

    document.getElementById("newOrderCount")
        .textContent = newOrders.length;

    document.getElementById("statusOrderCount")
        .textContent = statusOrders.length;


    renderOrders(
        newOrders,
        newContainer,
        "No new orders."
    );


    renderOrders(
        statusOrders,
        statusContainer,
        "No processed orders yet."
    );


    showOrderTab(currentOrderTab);
}


/* RENDER ORDERS */

function renderOrders(
    orders,
    container,
    emptyMessage
) {

    if (orders.length === 0) {

        container.innerHTML =
            `<div class="empty">
                ${emptyMessage}
            </div>`;

        return;
    }


    container.innerHTML =
        orders.map(order => {

            let items = [];


            try {

                items =
                    typeof order.items === "string"
                        ? JSON.parse(order.items)
                        : order.items || [];

            } catch {

                items = [];
            }


            const itemsHTML =
                items.map(item => `

                    <div class="order-item">

                        <span>
                            ${escapeHtml(
                                item.name || "Product"
                            )}
                            × ${Number(
                                item.quantity || 0
                            )}
                        </span>

                        <span>
                            ₱${Number(
                                item.subtotal ||
                                (
                                    Number(item.price || 0) *
                                    Number(item.quantity || 0)
                                )
                            ).toLocaleString(
                                "en-PH",
                                {
                                    minimumFractionDigits: 2
                                }
                            )}
                        </span>

                    </div>

                `).join("");


            const date =
                order.created_at
                    ? new Date(order.created_at)
                        .toLocaleString("en-PH")
                    : "";


            const status =
                order.status || "Pending";


            const statusLower =
                status.toLowerCase();


            const statusClass =
                statusLower === "pending"
                    ? "status-pending"
                    : statusLower === "confirmed"
                    ? "status-confirmed"
                    : statusLower === "completed"
                    ? "status-completed"
                    : "status-cancelled";


            return `

                <div class="order-card">

                    <div class="order-header">

                        <div class="order-number">
                            Order #${order.id}
                        </div>

                        <div class="status ${statusClass}">
                            ${escapeHtml(status)}
                        </div>

                    </div>


                    <div class="order-info">

                        <div>
                            <strong>Customer:</strong>
                            ${escapeHtml(
                                order.customer_name || ""
                            )}
                        </div>

                        <div>
                            <strong>Phone:</strong>
                            ${escapeHtml(
                                order.phone || ""
                            )}
                        </div>

                        <div>
                            <strong>Fulfillment:</strong>
                            ${escapeHtml(
                                order.fulfillment || ""
                            )}
                        </div>

                        <div>
                            <strong>Address:</strong>
                            ${escapeHtml(
                                order.address || ""
                            )}
                        </div>

                        <div>
                            <strong>Date:</strong>
                            ${escapeHtml(date)}
                        </div>

                        ${
                            order.notes
                                ? `
                                    <div>
                                        <strong>Notes:</strong>
                                        ${escapeHtml(
                                            order.notes
                                        )}
                                    </div>
                                  `
                                : ""
                        }

                    </div>


                    <div class="order-items">

                        ${
                            itemsHTML ||
                            "No item details."
                        }

                    </div>


                    <div class="order-total">

                        Total:
                        ₱${Number(
                            order.total || 0
                        ).toLocaleString(
                            "en-PH",
                            {
                                minimumFractionDigits: 2
                            }
                        )}

                    </div>


                    <div class="order-actions">

                        ${
                            status === "Pending"
                                ? `
                                    <button
                                        class="btn-warning"
                                        onclick="updateOrderStatus(
                                            ${order.id},
                                            'Confirmed'
                                        )"
                                    >
                                        Confirm
                                    </button>

                                    <button
                                        class="btn-danger"
                                        onclick="updateOrderStatus(
                                            ${order.id},
                                            'Cancelled'
                                        )"
                                    >
                                        Cancel
                                    </button>
                                  `
                                : `
                                    <button
                                        class="btn-success"
                                        onclick="updateOrderStatus(
                                            ${order.id},
                                            'Completed'
                                        )"
                                    >
                                        Complete
                                    </button>

                                    <button
                                        class="btn-warning"
                                        onclick="updateOrderStatus(
                                            ${order.id},
                                            'Confirmed'
                                        )"
                                    >
                                        Confirmed
                                    </button>
                                  `
                        }

                    </div>

                </div>

            `;

        }).join("");
}


/* UPDATE ORDER STATUS */

async function updateOrderStatus(id, status) {

    const { error } =
        await supabaseClient
            .from("orders")
            .update({
                status: status
            })
            .eq("id", id);


    if (error) {

        alert(error.message);

        return;
    }


    await loadOrders();
}


/* IMAGE TO DATA URL */

function fileToDataURL(file) {

    return new Promise((resolve, reject) => {

        const reader =
            new FileReader();

        reader.onload =
            () => resolve(reader.result);

        reader.onerror =
            reject;

        reader.readAsDataURL(file);
    });
}


/* ESCAPE HTML */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
