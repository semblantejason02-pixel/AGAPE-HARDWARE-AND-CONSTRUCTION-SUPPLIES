<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGAPE Hardware - Seller</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}

/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 6px 0 0;
    color: #bbb;
    font-size: 13px;
}

/* =========================
   GENERAL
========================= */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.card h2 {
    margin-top: 0;
}

.hidden {
    display: none !important;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 80px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14px;
}

.primary {
    background: #111;
    color: white;
}

.green {
    background: #16803c;
    color: white;
}

.red {
    background: #d32f2f;
    color: white;
}

.gray {
    background: #ddd;
    color: #222;
}

button:active {
    transform: scale(.98);
}

/* =========================
   LOGIN
========================= */

.login-box {
    max-width: 420px;
    margin: 50px auto;
}

.login-box h2 {
    text-align: center;
}

.message {
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 7px;
    background: #eee;
}

/* =========================
   ADMIN TOP BAR
========================= */

.admin-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.admin-title {
    font-size: 20px;
    font-weight: bold;
}

/* =========================
   NAVIGATION
========================= */

.admin-nav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 18px;
    padding-bottom: 3px;
}

.admin-nav button {
    white-space: nowrap;
    background: white;
    border: 1px solid #ccc;
    color: #222;
}

.admin-nav button.active {
    background: #111;
    color: white;
}

/* =========================
   DASHBOARD
========================= */

.dashboard-grid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.dashboard-box {
    background: white;
    padding: 18px;
    border-radius: 10px;
    box-shadow: 0 2px 7px rgba(0,0,0,.06);
}

.dashboard-label {
    color: #777;
    font-size: 13px;
}

.dashboard-number {
    font-size: 28px;
    font-weight: bold;
    margin-top: 7px;
}

/* =========================
   SECTION
========================= */

.admin-section {
    display: none;
}

.admin-section.active {
    display: block;
}

/* =========================
   PRODUCT FORM
========================= */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 15px;
}

.form-full {
    grid-column: 1 / -1;
}

.form-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.current-image {
    margin-bottom: 12px;
}

.current-image img {
    width: 120px;
    height: 100px;
    object-fit: cover;
    border-radius: 7px;
}

/* =========================
   PRODUCT LIST
========================= */

.product-list {
    display: grid;
    gap: 12px;
}

.product-card {
    display: flex;
    gap: 15px;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 14px;
    background: white;
}

.product-card img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 7px;
    background: #eee;
}

.product-info {
    flex: 1;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
    margin: 5px 0;
}

.product-meta {
    font-size: 14px;
    line-height: 1.7;
}

.stock-good {
    color: #16803c;
    font-weight: bold;
}

.stock-low {
    color: #d97706;
    font-weight: bold;
}

.stock-out {
    color: #d32f2f;
    font-weight: bold;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
}

/* =========================
   ORDERS
========================= */

.order-list {
    display: grid;
    gap: 15px;
}

.order-card {
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 15px;
    background: white;
}

.order-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

.order-number {
    font-size: 19px;
    font-weight: bold;
}

.status {
    padding: 6px 11px;
    border-radius: 15px;
    background: #eee;
    font-size: 13px;
    font-weight: bold;
}

.order-details {
    margin-top: 12px;
    line-height: 1.7;
}

.order-items {
    margin-top: 12px;
    background: #f5f5f5;
    padding: 12px;
    border-radius: 7px;
}

.order-item {
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
}

.order-item:last-child {
    border-bottom: none;
}

.order-total {
    text-align: right;
    font-size: 20px;
    font-weight: bold;
    margin-top: 12px;
}

.order-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 12px;
}

/* =========================
   EMPTY / STATUS
========================= */

.empty {
    text-align: center;
    padding: 25px;
    color: #777;
    background: #fafafa;
    border-radius: 8px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.section-header h2 {
    margin: 0;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .dashboard-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-full {
        grid-column: auto;
    }

    .product-card {
        flex-direction: column;
    }

    .product-card img {
        width: 100%;
        height: 180px;
    }

    .admin-top {
        align-items: flex-start;
        flex-direction: column;
    }

    .section-header {
        align-items: flex-start;
        flex-direction: column;
    }
}

@media (max-width: 400px) {

    .dashboard-grid {
        grid-template-columns: 1fr 1fr;
    }

    .dashboard-number {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<header>
    <h1>AGAPE HARDWARE AND SUPPLIES</h1>
    <p>Seller / Admin Panel</p>
</header>


<!-- =========================
     LOGIN
========================= -->

<div id="loginSection" class="container">

    <div class="card login-box">

        <h2>Seller Login</h2>

        <div id="loginMessage"></div>

        <label>Email</label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Seller email"
        >

        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button
            class="primary"
            style="width:100%;"
            onclick="loginSeller()"
        >
            LOGIN
        </button>

    </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="adminSection" class="container hidden">

    <div class="admin-top">

        <div class="admin-title">
            Seller Dashboard
        </div>

        <button
            class="red"
            onclick="logoutSeller()"
        >
            Logout
        </button>

    </div>


    <!-- NAVIGATION -->

    <div class="admin-nav">

        <button
            class="active"
            onclick="showSection('dashboardSection', this)"
        >
            📊 Dashboard
        </button>

        <button
            onclick="showSection('ordersSection', this)"
        >
            📦 Orders
        </button>

        <button
            onclick="showSection('productsSection', this)"
        >
            🛠 Products
        </button>

        <button
            onclick="showSection('addProductSection', this)"
        >
            ➕ Add Product
        </button>

    </div>


    <!-- =========================
         DASHBOARD
    ========================= -->

    <div
        id="dashboardSection"
        class="admin-section active"
    >

        <div class="dashboard-grid">

            <div class="dashboard-box">

                <div class="dashboard-label">
                    Products
                </div>

                <div
                    id="dashboardProducts"
                    class="dashboard-number"
                >
                    0
                </div>

            </div>

            <div class="dashboard-box">

                <div class="dashboard-label">
                    Low Stock
                </div>

                <div
                    id="dashboardLowStock"
                    class="dashboard-number"
                >
                    0
                </div>

            </div>

            <div class="dashboard-box">

                <div class="dashboard-label">
                    Total Orders
                </div>

                <div
                    id="dashboardOrders"
                    class="dashboard-number"
                >
                    0
                </div>

            </div>

            <div class="dashboard-box">

                <div class="dashboard-label">
                    Pending
                </div>

                <div
                    id="dashboardPending"
                    class="dashboard-number"
                >
                    0
                </div>

            </div>

        </div>


        <div class="card">

            <h2>Quick Actions</h2>

            <div class="actions">

                <button
                    class="green"
                    onclick="openAddProduct()"
                >
                    ➕ Add Product
                </button>

                <button
                    class="primary"
                    onclick="openOrders()"
                >
                    📦 View Orders
                </button>

                <button
                    class="primary"
                    onclick="openProducts()"
                >
                    🛠 Manage Products
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         ORDERS
    ========================= -->

    <div
        id="ordersSection"
        class="admin-section"
    >

        <div class="card">

            <div class="section-header">

                <h2>📦 Customer Orders</h2>

                <button
                    class="primary"
                    onclick="loadOrders()"
                >
                    Refresh
                </button>

            </div>

            <div id="ordersMessage"></div>

            <div
                id="ordersList"
                class="order-list"
            ></div>

        </div>

    </div>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <div
        id="productsSection"
        class="admin-section"
    >

        <div class="card">

            <div class="section-header">

                <h2>🛠 Products</h2>

                <button
                    class="primary"
                    onclick="loadProducts()"
                >
                    Refresh
                </button>

            </div>

            <div id="productsMessage"></div>

            <div
                id="productList"
                class="product-list"
            ></div>

        </div>

    </div>


    <!-- =========================
         ADD / EDIT PRODUCT
    ========================= -->

    <div
        id="addProductSection"
        class="admin-section"
    >

        <div class="card">

            <div class="section-header">

                <h2 id="productFormTitle">
                    Add Product
                </h2>

            </div>

            <input
                type="hidden"
                id="editProductId"
            >

            <div class="form-grid">

                <div class="form-full">

                    <label>
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                    >

                    <div
                        id="currentImage"
                        class="current-image"
                    ></div>

                </div>


                <div>

                    <label>Brand</label>

                    <input
                        type="text"
                        id="brand"
                        placeholder="Example: Boysen"
                    >

                </div>


                <div>

                    <label>Product Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Example: Boysen Paint"
                    >

                </div>


                <div>

                    <label>Category</label>

                    <select id="category">

                        <option value="Cement">
                            Cement
                        </option>

                        <option value="Steel">
                            Steel
                        </option>

                        <option value="Electrical">
                            Electrical
                        </option>

                        <option value="Plumbing">
                            Plumbing
                        </option>

                        <option value="Paint">
                            Paint
                        </option>

                        <option value="Tools">
                            Tools
                        </option>

                        <option value="Others">
                            Others
                        </option>

                    </select>

                </div>


                <div>

                    <label>Unit</label>

                    <input
                        type="text"
                        id="unit"
                        value="Piece"
                        placeholder="Piece / Box / Gallon / Bag"
                    >

                </div>


                <div>

                    <label>Price</label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                    >

                </div>


                <div>

                    <label>Stock</label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        step="1"
                        placeholder="0"
                    >

                </div>


                <div class="form-full">

                    <label>Description</label>

                    <textarea
                        id="description"
                        placeholder="Product description"
                    ></textarea>

                </div>

            </div>


            <div class="form-actions">

                <button
                    class="green"
                    onclick="saveProduct()"
                >
                    SAVE PRODUCT
                </button>

                <button
                    id="cancelEditButton"
                    class="gray hidden"
                    onclick="cancelEdit()"
                >
                    CANCEL EDIT
                </button>

            </div>

            <div
                id="productMessage"
                style="margin-top:12px;"
            ></div>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://djeqfrifhqcpfxccotdl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MAi_oJyKtuW1sM9YddWMMA_7tXcH1rP";

let supabaseClient = null;


/* =========================
   INITIALIZE
========================= */

(function () {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

})();


/* =========================
   NAVIGATION
========================= */

function showSection(sectionId, button) {

    document
        .querySelectorAll(".admin-section")
        .forEach(section => {
            section.classList.remove("active");
        });

    document
        .getElementById(sectionId)
        .classList.add("active");

    document
        .querySelectorAll(".admin-nav button")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    if (button) {
        button.classList.add("active");
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function openAddProduct() {

    const buttons =
        document.querySelectorAll(
            ".admin-nav button"
        );

    showSection(
        "addProductSection",
        buttons[3]
    );

}


function openOrders() {

    const buttons =
        document.querySelectorAll(
            ".admin-nav button"
        );

    showSection(
        "ordersSection",
        buttons[1]
    );

}


function openProducts() {

    const buttons =
        document.querySelectorAll(
            ".admin-nav button"
        );

    showSection(
        "productsSection",
        buttons[2]
    );

}


/* =========================
   LOGIN
========================= */

window.loginSeller = async function () {

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document.getElementById(
            "loginMessage"
        );

    if (!email || !password) {

        message.innerHTML =
            `<div class="message">
                Please enter email and password.
            </div>`;

        return;
    }

    message.innerHTML =
        `<div class="message">
            Logging in...
        </div>`;

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        message.innerHTML =
            `<div class="message">
                Login failed:
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    document
        .getElementById("loginSection")
        .classList.add("hidden");

    document
        .getElementById("adminSection")
        .classList.remove("hidden");


    await loadProducts();
    await loadOrders();

};


/* =========================
   LOGOUT
========================= */

window.logoutSeller = async function () {

    await supabaseClient.auth.signOut();

    location.reload();

};


/* =========================
   SESSION
========================= */

async function checkSession() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (
        data &&
        data.session
    ) {

        document
            .getElementById("loginSection")
            .classList.add("hidden");

        document
            .getElementById("adminSection")
            .classList.remove("hidden");

        await loadProducts();
        await loadOrders();

    }

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts() {

    const message =
        document.getElementById(
            "productsMessage"
        );

    const list =
        document.getElementById(
            "productList"
        );

    message.innerHTML =
        "Loading products...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        message.innerHTML =
            `<div class="message">
                Error loading products:
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    message.innerHTML = "";


    /* Dashboard numbers */

    const totalProducts =
        data ? data.length : 0;

    const lowStock =
        data
        ? data.filter(
            product =>
                Number(product.stock || 0) <= 5
        ).length
        : 0;


    document.getElementById(
        "dashboardProducts"
    ).textContent =
        totalProducts;


    document.getElementById(
        "dashboardLowStock"
    ).textContent =
        lowStock;


    if (!data || data.length === 0) {

        list.innerHTML =
            `<div class="empty">
                No products yet.
            </div>`;

        return;
    }


    list.innerHTML =
        data.map(product => {

            const price =
                Number(
                    product.price || 0
                );

            const stock =
                Number(
                    product.stock || 0
                );

            const image =
                product.image ||
                "https://via.placeholder.com/200x150?text=No+Image";


            let stockClass =
                "stock-good";

            if (stock <= 0) {
                stockClass = "stock-out";
            } else if (stock <= 5) {
                stockClass = "stock-low";
            }


            return `

                <div class="product-card">

                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(product.name || "")}"
                    >

                    <div class="product-info">

                        <div>
                            <strong>
                                ${escapeHtml(
                                    product.brand || ""
                                )}
                            </strong>
                        </div>

                        <div class="product-name">
                            ${escapeHtml(
                                product.name || ""
                            )}
                        </div>

                        <div class="product-meta">

                            <div>
                                Category:
                                ${escapeHtml(
                                    product.category || "Others"
                                )}
                            </div>

                            <div>
                                Price:
                                <strong>
                                    ₱${price.toLocaleString(
                                        "en-PH",
                                        {
                                            minimumFractionDigits: 2
                                        }
                                    )}
                                </strong>
                                /
                                ${escapeHtml(
                                    product.unit || "Piece"
                                )}
                            </div>

                            <div>
                                Stock:
                                <span class="${stockClass}">
                                    ${stock}
                                </span>
                            </div>

                            <div>
                                ${escapeHtml(
                                    product.description || ""
                                )}
                            </div>

                        </div>


                        <div class="actions">

                            <button
                                class="primary"
                                onclick='editProduct(${JSON.stringify(product)})'
                            >
                                Edit
                            </button>

                            <button
                                class="red"
                                onclick="deleteProduct(${product.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct() {

    const message =
        document.getElementById(
            "productMessage"
        );

    const editId =
        document.getElementById(
            "editProductId"
        ).value;

    const brand =
        document.getElementById(
            "brand"
        ).value.trim();

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const category =
        document.getElementById(
            "category"
        ).value;

    const description =
        document.getElementById(
            "description"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "price"
            ).value || 0
        );

    const unit =
        document.getElementById(
            "unit"
        ).value.trim() ||
        "Piece";

    const stock =
        Number(
            document.getElementById(
                "stock"
            ).value || 0
        );


    if (!name) {

        message.innerHTML =
            `<div class="message">
                Product name is required.
            </div>`;

        return;
    }


    message.innerHTML =
        "Saving...";


    let image = null;


    if (editId) {

        image =
            document.getElementById(
                "currentImage"
            ).dataset.image || null;

    }


    const file =
        document.getElementById(
            "productImage"
        ).files[0];


    if (file) {

        image =
            await fileToDataURL(file);

    }


    const productData = {

        brand:
            brand,

        name:
            name,

        description:
            description,

        price:
            price,

        unit:
            unit,

        stock:
            stock,

        image:
            image,

        category:
            category

    };


    let result;


    if (editId) {

        result =
            await supabaseClient
                .from("products")
                .update(productData)
                .eq("id", editId);

    } else {

        result =
            await supabaseClient
                .from("products")
                .insert([
                    productData
                ]);

    }


    if (result.error) {

        console.error(result.error);

        message.innerHTML =
            `<div class="message">
                Error:
                ${escapeHtml(
                    result.error.message
                )}
            </div>`;

        return;
    }


    message.innerHTML =
        `<div class="message">
            Product saved successfully.
        </div>`;


    cancelEdit();

    await loadProducts();

}


/* =========================
   EDIT PRODUCT
========================= */

window.editProduct = function (product) {

    document.getElementById(
        "productFormTitle"
    ).textContent =
        "Edit Product";


    document.getElementById(
        "editProductId"
    ).value =
        product.id;


    document.getElementById(
        "brand"
    ).value =
        product.brand || "";


    document.getElementById(
        "name"
    ).value =
        product.name || "";


    document.getElementById(
        "category"
    ).value =
        product.category || "Others";


    document.getElementById(
        "description"
    ).value =
        product.description || "";


    document.getElementById(
        "price"
    ).value =
        product.price || 0;


    document.getElementById(
        "unit"
    ).value =
        product.unit || "Piece";


    document.getElementById(
        "stock"
    ).value =
        product.stock || 0;


    const currentImage =
        document.getElementById(
            "currentImage"
        );

    currentImage.dataset.image =
        product.image || "";


    if (product.image) {

        currentImage.innerHTML =
            `
            <p>Current image:</p>

            <img
                src="${escapeHtml(product.image)}"
            >
            `;

    } else {

        currentImage.innerHTML =
            "<p>No current image.</p>";

    }


    document.getElementById(
        "cancelEditButton"
    ).classList.remove("hidden");


    openAddProduct();

};

========================= */

window.deleteProduct = async function (id) {

    if (
        !confirm(
            "Delete this product?"
        )
    ) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }


    await loadProducts();

};


/* =========================
   ORDERS
========================= */

async function loadOrders() {

    const message =
        document.getElementById(
            "ordersMessage"
        );

    const list =
        document.getElementById(
            "ordersList"
        );


    message.innerHTML =
        "Loading orders...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        message.innerHTML =
            `<div class="message">
                Error loading orders:
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    message.innerHTML = "";


    const totalOrders =
        data ? data.length : 0;

    const pendingOrders =
        data
        ? data.filter(
            order =>
                (order.status || "Pending")
                === "Pending"
        ).length
        : 0;


    document.getElementById(
        "dashboardOrders"
    ).textContent =
        totalOrders;


    document.getElementById(
        "dashboardPending"
    ).textContent =
        pendingOrders;


    if (!data || data.length === 0) {

        list.innerHTML =
            `<div class="empty">
                No customer orders yet.
            </div>`;

        return;
    }


    list.innerHTML =
        data.map(order => {

            let items = [];


            try {

                items =
                    typeof order.items === "string"
                    ? JSON.parse(order.items)
                    : order.items || [];

            } catch (e) {

                items = [];

            }


            const orderDate =
                order.created_at
                ? new Date(
                    order.created_at
                ).toLocaleString(
                    "en-PH"
                )
                : "";


            const total =
                Number(
                    order.total || 0
                );


            return `

                <div class="order-card">

                    <div class="order-header">

                        <div class="order-number">
                            Order #${order.id}
                        </div>

                        <div class="status">
                            ${escapeHtml(
                                order.status || "Pending"
                            )}
                        </div>

                    </div>


                    <div class="order-details">

                        <strong>
                            Customer:
                        </strong>
                        ${escapeHtml(
                            order.customer_name || ""
                        )}

                        <br>

                        <strong>
                            Mobile:
                        </strong>
                        ${escapeHtml(
                            order.phone || ""
                        )}

                        <br>

                        <strong>
                            Type:
                        </strong>
                        ${escapeHtml(
                            order.fulfillment || ""
                        )}

                        <br>

                        <strong>
                            Address / Pickup:
                        </strong>
                        ${escapeHtml(
                            order.address || ""
                        )}

                        <br>

                        <strong>
                            Date:
                        </strong>
                        ${escapeHtml(
                            orderDate
                        )}

                        ${
                            order.notes
                            ? `
                            <br>
                            <strong>
                                Notes:
                            </strong>
                            ${escapeHtml(
                                order.notes
                            )}
                            `
                            : ""
                        }

                    </div>


                    <div class="order-items">

                        <strong>
                            Ordered Products
                        </strong>

                        ${
                            items.length > 0
                            ? items.map(item => {

                                const quantity =
                                    Number(
                                        item.quantity || 0
                                    );

                                const subtotal =
                                    Number(
                                        item.subtotal ||
                                        (
                                            Number(
                                                item.price || 0
                                            ) *
                                            quantity
                                        )
                                    );

                                return `

                                    <div class="order-item">

                                        ${escapeHtml(
                                            item.name || ""
                                        )}

                                        ×
                                        ${quantity}

                                        <span style="
                                            float:right;
                                        ">

                                            ₱${subtotal.toLocaleString(
                                                "en-PH",
                                                {
                                                    minimumFractionDigits: 2
                                                }
                                            )}

                                        </span>

                                    </div>

                                `;

                            }).join("")
                            : "No item details."

                        }

                    </div>


                    <div class="order-total">

                        Total:
                        ₱${total.toLocaleString(
                            "en-PH",
                            {
                                minimumFractionDigits: 2
                            }
                        )}

                    </div>


                    <div class="order-actions">

                        <button
                            class="primary"
                            onclick="updateOrderStatus(
                                ${order.id},
                                'Pending'
                            )"
                        >
                            Pending
                        </button>

                        <button
                            class="green"
                            onclick="updateOrderStatus(
                                ${order.id},
                                'Confirmed'
                            )"
                        >
                            Confirmed
                        </button>

                        <button
                            class="primary"
                            onclick="updateOrderStatus(
                                ${order.id},
                                'Completed'
                            )"
                        >
                            Completed
                        </button>

                        <button
                            class="red"
                            onclick="updateOrderStatus(
                                ${order.id},
                                'Cancelled'
                            )"
                        >
                            Cancelled
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   UPDATE ORDER STATUS
========================= */

window.updateOrderStatus =
async function (id, status) {

    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({
                status: status
            })
            .eq("id", id);


    if (error) {

        alert(
            "Unable to update order: " +
            error.message
        );

        return;
    }


    await loadOrders();

};


/* =========================
   IMAGE
========================= */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
