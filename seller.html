<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGAPE Hardware - Seller</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

input,
textarea,
select {
    width: 100%;
    padding: 11px;
    margin-top: 5px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    min-height: 80px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
}

.primary {
    background: #111;
    color: white;
}

.green {
    background: #16803c;
    color: white;
}

.red {
    background: #d32f2f;
    color: white;
}

.gray {
    background: #ddd;
    color: #222;
}

.hidden {
    display: none !important;
}

.login-box {
    max-width: 420px;
    margin: 50px auto;
}

.message {
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 6px;
    background: #eee;
}

.product-list,
.order-list {
    display: grid;
    gap: 15px;
}

.product-card,
.order-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    background: #fff;
}

.product-card {
    display: flex;
    gap: 15px;
}

.product-card img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 6px;
    background: #eee;
}

.product-info {
    flex: 1;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.order-number {
    font-size: 18px;
    font-weight: bold;
}

.status {
    padding: 6px 10px;
    border-radius: 15px;
    background: #eee;
    font-size: 13px;
}

.order-details {
    margin-top: 12px;
    line-height: 1.6;
}

.order-items {
    margin-top: 12px;
    background: #f5f5f5;
    padding: 10px;
    border-radius: 6px;
}

.order-total {
    text-align: right;
    font-size: 19px;
    font-weight: bold;
    margin-top: 10px;
}

.logout {
    float: right;
}

@media (max-width: 600px) {

    .product-card {
        flex-direction: column;
    }

    .product-card img {
        width: 100%;
        height: 180px;
    }

    .logout {
        float: none;
        margin-top: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>AGAPE HARDWARE AND SUPPLIES</h1>
    <div>Seller / Admin Panel</div>
</header>


<!-- LOGIN -->

<div id="loginSection" class="container">

    <div class="card login-box">

        <h2>Seller Login</h2>

        <div id="loginMessage"></div>

        <label>Email</label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Seller email"
        >

        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button
            class="primary"
            style="width:100%;"
            onclick="loginSeller()"
        >
            LOGIN
        </button>

    </div>

</div>


<!-- ADMIN -->

<div id="adminSection" class="container hidden">

    <button
        class="red logout"
        onclick="logoutSeller()"
    >
        Logout
    </button>

    <div style="clear:both;"></div>

    <!-- ORDERS -->

    <div class="card">

        <h2>📦 Customer Orders</h2>

        <button
            class="primary"
            onclick="loadOrders()"
        >
            Refresh Orders
        </button>

        <div
            id="ordersMessage"
            style="margin-top:12px;"
        ></div>

        <div
            id="ordersList"
            class="order-list"
        ></div>

    </div>


    <!-- ADD / EDIT PRODUCT -->

    <div class="card">

        <h2 id="productFormTitle">
            Add Product
        </h2>

        <input
            type="hidden"
            id="editProductId"
        >

        <label>Product Image</label>

        <input
            type="file"
            id="productImage"
            accept="image/*"
        >

        <div id="currentImage"></div>

        <label>Brand</label>

        <input
            type="text"
            id="brand"
            placeholder="Example: Boysen"
        >

        <label>Product Name</label>

        <input
            type="text"
            id="name"
            placeholder="Example: Boysen Paint"
        >

        <label>Category</label>

        <select id="category">

            <option value="Cement">Cement</option>
            <option value="Steel">Steel</option>
            <option value="Electrical">Electrical</option>
            <option value="Plumbing">Plumbing</option>
            <option value="Paint">Paint</option>
            <option value="Tools">Tools</option>
            <option value="Others">Others</option>

        </select>

        <label>Description</label>

        <textarea
            id="description"
            placeholder="Product description"
        ></textarea>

        <label>Price</label>

        <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            placeholder="0.00"
        >

        <label>Unit</label>

        <input
            type="text"
            id="unit"
            value="Piece"
            placeholder="Piece / Box / Gallon / Bag"
        >

        <label>Stock</label>

        <input
            type="number"
            id="stock"
            min="0"
            step="1"
            placeholder="0"
        >

        <div class="actions">

            <button
                class="green"
                onclick="saveProduct()"
            >
                SAVE PRODUCT
            </button>

            <button
                id="cancelEditButton"
                class="gray hidden"
                onclick="cancelEdit()"
            >
                CANCEL EDIT
            </button>

        </div>

        <div
            id="productMessage"
            style="margin-top:12px;"
        ></div>

    </div>


    <!-- PRODUCTS -->

    <div class="card">

        <h2>🛠 Products</h2>

        <button
            class="primary"
            onclick="loadProducts()"
        >
            Refresh Products
        </button>

        <div
            id="productsMessage"
            style="margin-top:12px;"
        ></div>

        <div
            id="productList"
            class="product-list"
        ></div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://djeqfrifhqcpfxccotdl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MAi_oJyKtuW1sM9YddWMMA_7tXcH1rP";

let supabaseClient = null;


/* =========================
   INITIALIZE
========================= */

(function () {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

})();


/* =========================
   LOGIN
========================= */

window.loginSeller = async function () {

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document.getElementById(
            "loginMessage"
        );

    if (!email || !password) {

        message.innerHTML =
            `<div class="message">
                Please enter email and password.
            </div>`;

        return;
    }

    message.innerHTML =
        `<div class="message">
            Logging in...
        </div>`;

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        message.innerHTML =
            `<div class="message">
                Login failed: ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    document
        .getElementById("loginSection")
        .classList.add("hidden");

    document
        .getElementById("adminSection")
        .classList.remove("hidden");


    await loadProducts();

    await loadOrders();

};


/* =========================
   LOGOUT
========================= */

window.logoutSeller = async function () {

    await supabaseClient.auth.signOut();

    location.reload();

};


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (
        data &&
        data.session
    ) {

        document
            .getElementById("loginSection")
            .classList.add("hidden");

        document
            .getElementById("adminSection")
            .classList.remove("hidden");

        await loadProducts();

        await loadOrders();

    }

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts() {

    const message =
        document.getElementById(
            "productsMessage"
        );

    const list =
        document.getElementById(
            "productList"
        );

    message.innerHTML =
        "Loading products...";

    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        message.innerHTML =
            `<div class="message">
                Error loading products:
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    message.innerHTML = "";


    if (!data || data.length === 0) {

        list.innerHTML =
            `<div class="message">
                No products yet.
            </div>`;

        return;
    }


    list.innerHTML =
        data.map(product => {

            const price =
                Number(
                    product.price || 0
                );

            const stock =
                Number(
                    product.stock || 0
                );

            const image =
                product.image ||
                "https://via.placeholder.com/200x150?text=No+Image";


            return `

                <div class="product-card">

                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(product.name || "")}"
                    >

                    <div class="product-info">

                        <div>
                            <strong>
                                ${escapeHtml(product.brand || "")}
                            </strong>
                        </div>

                        <h3>
                            ${escapeHtml(product.name || "")}
                        </h3>

                        <div>
                            Category:
                            ${escapeHtml(product.category || "Others")}
                        </div>

                        <div>
                            Price:
                            <strong>
                                ₱${price.toLocaleString(
                                    "en-PH",
                                    {
                                        minimumFractionDigits: 2
                                    }
                                )}
                            </strong>
                            / ${escapeHtml(product.unit || "Piece")}
                        </div>

                        <div>
                            Stock:
                            <strong>
                                ${stock}
                            </strong>
                        </div>

                        <div>
                            ${escapeHtml(
                                product.description || ""
                            )}
                        </div>

                        <div class="actions">

                            <button
                                class="primary"
                                onclick='editProduct(${JSON.stringify(product)})'
                            >
                                Edit
                            </button>

                            <button
                                class="red"
                                onclick="deleteProduct(${product.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct() {

    const message =
        document.getElementById(
            "productMessage"
        );

    const editId =
        document.getElementById(
            "editProductId"
        ).value;

    const brand =
        document.getElementById(
            "brand"
        ).value.trim();

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const category =
        document.getElementById(
            "category"
        ).value;

    const description =
        document.getElementById(
            "description"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "price"
            ).value || 0
        );

    const unit =
        document.getElementById(
            "unit"
        ).value.trim() ||
        "Piece";

    const stock =
        Number(
            document.getElementById(
                "stock"
            ).value || 0
        );


    if (!name) {

        message.innerHTML =
            `<div class="message">
                Product name is required.
            </div>`;

        return;
    }


    message.innerHTML =
        "Saving...";


    let image = null;


    /* Existing image during edit */

    if (editId) {

        image =
            document.getElementById(
                "currentImage"
            ).dataset.image || null;

    }


    /* New image */

    const file =
        document.getElementById(
            "productImage"
        ).files[0];


    if (file) {

        image =
            await fileToDataURL(file);

    }


    const productData = {

        brand:
            brand,

        name:
            name,

        description:
            description,

        price:
            price,

        unit:
            unit,

        stock:
            stock,

        image:
            image,

        category:
            category

    };


    let result;


    if (editId) {

        result =
            await supabaseClient
                .from("products")
                .update(productData)
                .eq("id", editId);

    } else {

        result =
            await supabaseClient
                .from("products")
                .insert([
                    productData
                ]);

    }


    if (result.error) {

        console.error(result.error);

        message.innerHTML =
            `<div class="message">
                Error:
                ${escapeHtml(
                    result.error.message
                )}
            </div>`;

        return;
    }


    message.innerHTML =
        `<div class="message">
            Product saved successfully.
        </div>`;


    cancelEdit();

    await loadProducts();

}


/* =========================
   EDIT PRODUCT
========================= */

window.editProduct = function (product) {

    document.getElementById(
        "productFormTitle"
    ).textContent =
        "Edit Product";


    document.getElementById(
        "editProductId"
    ).value =
        product.id;


    document.getElementById(
        "brand"
    ).value =
        product.brand || "";


    document.getElementById(
        "name"
    ).value =
        product.name || "";


    document.getElementById(
        "category"
    ).value =
        product.category || "Others";


    document.getElementById(
        "description"
    ).value =
        product.description || "";


    document.getElementById(
        "price"
    ).value =
        product.price || 0;


    document.getElementById(
        "unit"
    ).value =
        product.unit || "Piece";


    document.getElementById(
        "stock"
    ).value =
        product.stock || 0;


    const currentImage =
        document.getElementById(
            "currentImage"
        );

    currentImage.dataset.image =
        product.image || "";


    if (product.image) {

        currentImage.innerHTML =
            `
            <p>Current image:</p>
            <img
                src="${escapeHtml(product.image)}"
                style="
                    width:120px;
                    height:100px;
                    object-fit:cover;
                    border-radius:6px;
                "
            >
            `;

    } else {

        currentImage.innerHTML =
            "<p>No current image.</p>";

    }


    document.getElementById(
        "cancelEditButton"
    ).classList.remove("hidden");


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

};


/* =========================
   CANCEL EDIT
========================= */

window.cancelEdit = function () {

    document.getElementById(
        "productFormTitle"
    ).textContent =
        "Add Product";


    document.getElementById(
        "editProductId"
    ).value = "";


    document.getElementById(
        "brand"
    ).value = "";


    document.getElementById(
        "name"
    ).value = "";


    document.getElementById(
        "category"
    ).value = "Others";


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "price"
    ).value = "";


    document.getElementById(
        "unit"
    ).value = "Piece";


    document.getElementById(
        "stock"
    ).value = "";


    document.getElementById(
        "productImage"
    ).value = "";


    const currentImage =
        document.getElementById(
            "currentImage"
        );

    currentImage.innerHTML = "";

    currentImage.dataset.image = "";


    document.getElementById(
        "cancelEditButton"
    ).classList.add("hidden");

};


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct = async function (id) {

    if (
        !confirm(
            "Delete this product?"
        )
    ) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }


    await loadProducts();

};


/* =========================
   ORDERS
========================= */

async function loadOrders() {

    const message =
        document.getElementById(
            "ordersMessage"
        );

    const list =
        document.getElementById(
            "ordersList"
        );


    message.innerHTML =
        "Loading orders...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        message.innerHTML =
            `<div class="message">
                Error loading orders:
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    message.innerHTML = "";


    if (!data || data.length === 0) {

        list.innerHTML =
            `<div class="message">
                No customer orders yet.
            </div>`;

        return;
    }


    list.innerHTML =
        data.map(order => {

            let items = [];


            try {

                items =
                    typeof order.items === "string"
                    ? JSON.parse(order.items)
                    : order.items || [];

            } catch (e) {

                items = [];

            }


            const orderDate =
                order.created_at
                ? new Date(
                    order.created_at
                ).toLocaleString(
                    "en-PH"
                )
                : "";


            const total =
                Number(
                    order.total || 0
                );


            return `

                <div class="order-card">

                    <div class="order-header">

                        <div class="order-number">
                            Order #${order.id}
                        </div>

                        <div class="status">
                            ${escapeHtml(
                                order.status || "Pending"
                            )}
                        </div>

                    </div>

                    <div class="order-details">

                        <strong>
                            Customer:
                        </strong>
                        ${escapeHtml(
                            order.customer_name || ""
                        )}

                        <br>

                        <strong>
                            Mobile:
                        </strong>
                        ${escapeHtml(
                            order.phone || ""
                        )}

                        <br>

                        <strong>
                            Type:
                        </strong>
                        ${escapeHtml(
                            order.fulfillment || ""
                        )}

                        <br>

                        <strong>
                            Address / Pickup:
                        </strong>
                        ${escapeHtml(
                            order.address || ""
                        )}

                        <br>

                        <strong>
                            Date:
                        </strong>
                        ${escapeHtml(
                            orderDate
                        )}

                        ${
                            order.notes
                            ? `
                            <br>
                            <strong>
                                Notes:
                            </strong>
                            ${escapeHtml(
                                order.notes
                            )}
                            `
                            : ""
                        }

                    </div>


                    <div class="order-items">

                        <strong>
                            Ordered Products
                        </strong>

                        ${
                            items.length > 0
                            ? items.map(item => {

                                const subtotal =
                                    Number(
                                        item.subtotal ||
                                        (
                                            Number(
                                                item.price || 0
                                            ) *
                                            Number(
                                                item.quantity || 0
                                            )
                                        )
                                    );

                                return `

                                    <div style="
                                        padding:7px 0;
                                        border-bottom:1px solid #ddd;
                                    ">

                                        ${escapeHtml(
                                            item.name || ""
                                        )}

                                        ×
                                        ${Number(
                                            item.quantity || 0
                                        )}

                                        <span style="
                                            float:right;
                                        ">

                                            ₱${subtotal.toLocaleString(
                                                "en-PH",
                                                {
                                                    minimumFractionDigits: 2
                                                }
                                            )}

                                        </span>

                                    </div>

                                `;

                            }).join("")
                            : "No item details."

                        }

                    </div>


                    <div class="order-total">

                        Total:
                        ₱${total.toLocaleString(
                            "en-PH",
                            {
                                minimumFractionDigits: 2
                            }
                        )}

                    </div>


                    <div class="actions">

                        <button
                            class="primary"
                            onclick="updateOrderStatus(${order.id}, 'Pending')"
                        >
                            Pending
                        </button>

                        <button
                            class="green"
                            onclick="updateOrderStatus(${order.id}, 'Confirmed')"
                        >
                            Confirmed
                        </button>

                        <button
                            class="primary"
                            onclick="updateOrderStatus(${order.id}, 'Completed')"
                        >
                            Completed
                        </button>

                        <button
                            class="red"
                            onclick="updateOrderStatus(${order.id}, 'Cancelled')"
                        >
                            Cancelled
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   UPDATE ORDER STATUS
========================= */

window.updateOrderStatus =
async function (id, status) {

    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({
                status: status
            })
            .eq("id", id);


    if (error) {

        alert(
            "Unable to update order: " +
            error.message
        );

        return;
    }


    await loadOrders();

};


/* =========================
   IMAGE TO DATA URL
========================= */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
