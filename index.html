<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AGAPE HARDWARE AND SUPPLIES</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 15px;
        }

        .search {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .category {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        .category button {
            padding: 10px 15px;
            border: none;
            background: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .product-image {
            height: 130px;
            background: #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .product h3 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stock {
            color: green;
            margin-bottom: 12px;
        }

        .add-cart {
            width: 100%;
            padding: 10px;
            background: #f59e0b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #111827;
            color: white;
            padding: 15px 20px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 1000;
        }

        .cart-panel {
            display: none;
            position: fixed;
            right: 20px;
            bottom: 80px;
            width: 350px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 999;
        }

        .cart-item {
            margin: 10px 0;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .quantity button {
            padding: 5px 10px;
            margin: 5px 3px;
            cursor: pointer;
        }

        .remove {
            margin-left: 8px;
        }

        .close-cart {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>🏗️ AGAPE HARDWARE AND SUPPLIES</h1>

    <input
        type="text"
        class="search"
        placeholder="Search hardware products..."
    >
</header>

<div class="container">

    <div class="category">
        <button>All</button>
        <button>Cement</button>
        <button>Steel</button>
        <button>Electrical</button>
        <button>Plumbing</button>
        <button>Tools</button>
    </div>

    <div class="products">

        <!-- PRODUCT 1 -->
        <div class="product">

            <div class="product-image">
                Product Image
            </div>

            <h3>Portland Cement</h3>

            <div class="price">₱280.00</div>

            <div class="stock">
                🟢 50 available
            </div>

            <button class="add-cart">
                Add to Cart
            </button>

        </div>


        <!-- PRODUCT 2 -->
        <div class="product">

            <div class="product-image">
                Product Image
            </div>

            <h3>Steel Bar 10mm</h3>

            <div class="price">₱380.00</div>

            <div class="stock">
                🟢 80 available
            </div>

            <button class="add-cart">
                Add to Cart
            </button>

        </div>


        <!-- PRODUCT 3 -->
        <div class="product">

            <div class="product-image">
                Product Image
            </div>

            <h3>PVC Pipe 1/2"</h3>

            <div class="price">₱180.00</div>

            <div class="stock">
                🟢 42 available
            </div>

            <button class="add-cart">
                Add to Cart
            </button>

        </div>

    </div>

</div>


<!-- CART BUTTON -->

<div class="cart" id="cartButton">
    🛒 Cart (0)
</div>


<!-- CART PANEL -->

<div class="cart-panel" id="cartPanel">

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <hr>

    <h3>
        Total: ₱<span id="cartTotal">0.00</span>
    </h3>

    <button class="close-cart" onclick="closeCart()">
        Close
    </button>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    let cart = [];

    const cartButton = document.getElementById("cartButton");
    const cartPanel = document.getElementById("cartPanel");
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    const addButtons = document.querySelectorAll(".add-cart");


    /* ADD PRODUCT TO CART */

    addButtons.forEach(function(button) {

        button.addEventListener("click", function() {

            const product = button.closest(".product");

            const name =
                product.querySelector("h3").textContent.trim();

            const priceText =
                product.querySelector(".price").textContent;

            const price =
                parseFloat(
                    priceText
                        .replace("₱", "")
                        .replace(",", "")
                );


            const existing =
                cart.find(function(item) {

                    return item.name === name;

                });


            if (existing) {

                existing.quantity++;

            } else {

                cart.push({

                    name: name,

                    price: price,

                    quantity: 1

                });

            }


            updateCart();

        });

    });


    /* OPEN CART */

    cartButton.addEventListener("click", function() {

        cartPanel.style.display = "block";

    });


    /* CLOSE CART */

    window.closeCart = function() {

        cartPanel.style.display = "none";

    };


    /* CHANGE QUANTITY */

    window.changeQuantity = function(name, amount) {

        const item =
            cart.find(function(item) {

                return item.name === name;

            });


        if (!item) return;


        item.quantity += amount;


        if (item.quantity <= 0) {

            cart =
                cart.filter(function(item) {

                    return item.name !== name;

                });

        }


        updateCart();

    };


    /* REMOVE PRODUCT */

    window.removeItem = function(name) {

        cart =
            cart.filter(function(item) {

                return item.name !== name;

            });


        updateCart();

    };


    /* UPDATE CART */

    function updateCart() {

        cartItems.innerHTML = "";

        let total = 0;

        let itemCount = 0;


        cart.forEach(function(item) {

            const subtotal =
                item.price * item.quantity;


            total += subtotal;

            itemCount += item.quantity;


            cartItems.innerHTML += `

                <div class="cart-item">

                    <strong>
                        ${item.name}
                    </strong>

                    <br>

                    ₱${item.price.toFixed(2)}

                    <div class="quantity">

                        <button
                            onclick="changeQuantity('${item.name}', -1)">
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="changeQuantity('${item.name}', 1)">
                            +
                        </button>

                        <button
                            class="remove"
                            onclick="removeItem('${item.name}')">
                            🗑️
                        </button>

                    </div>

                    <div>

                        Subtotal:
                        ₱${subtotal.toFixed(2)}

                    </div>

                </div>

            `;

        });


        cartTotal.textContent =
            total.toFixed(2);


        cartButton.textContent =
            "🛒 Cart (" + itemCount + ")";

    }

});

</script>

</body>
</html>
```
