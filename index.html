<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGAPE HARDWARE AND SUPPLIES</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #1f2937;
    color: white;
    padding: 20px;
}

header h1 {
    margin-bottom: 15px;
}

.search {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.category {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-bottom: 20px;
    padding-bottom: 5px;
}

.category button {
    padding: 10px 15px;
    border: none;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    font-weight: bold;
}

.category button.active {
    background: #f59e0b;
    color: #111827;
}

.products {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(180px, 1fr)
    );
    gap: 15px;
}

.product {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.product-image {
    height: 180px;
    width: 100%;
    background: #ddd;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    object-fit: cover;
}

.product h3 {
    margin: 6px 0 8px;
}

.category-label {
    display: inline-block;
    background: #e5e7eb;
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 12px;
    margin-bottom: 8px;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
    margin-bottom: 5px;
}

.stock {
    color: green;
    margin-bottom: 12px;
}

.out-stock {
    color: red;
}

.add-cart {
    width: 100%;
    padding: 10px;
    background: #f59e0b;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.add-cart:disabled {
    background: #ccc;
    cursor: not-allowed;
}

.cart {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #111827;
    color: white;
    padding: 15px 20px;
    border-radius: 30px;
    cursor: pointer;
    z-index: 1000;
}

.cart-panel {
    display: none;
    position: fixed;
    right: 20px;
    bottom: 80px;
    width: 350px;
    max-width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    z-index: 999;
}

.cart-item {
    margin: 10px 0;
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

.quantity button {
    padding: 5px 10px;
    margin: 5px 3px;
    cursor: pointer;
}

.remove {
    margin-left: 8px;
}

.close-cart {
    margin-top: 15px;
    padding: 10px;
    width: 100%;
    cursor: pointer;
}

#statusMessage {
    text-align: center;
    padding: 20px;
    color: #555;
}

.no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: #777;
}
</style>
</head>

<body>

<header>

    <h1>🏗️ AGAPE HARDWARE AND SUPPLIES</h1>

    <input
        type="text"
        class="search"
        id="searchInput"
        placeholder="Search hardware products..."
    >

</header>


<div class="container">

    <!-- CATEGORIES -->

    <div class="category" id="categoryButtons">

        <button
            class="active"
            data-category="All"
        >
            All
        </button>

        <button data-category="Cement">
            Cement
        </button>

        <button data-category="Steel">
            Steel
        </button>

        <button data-category="Electrical">
            Electrical
        </button>

        <button data-category="Plumbing">
            Plumbing
        </button>

        <button data-category="Paint">
            Paint
        </button>

        <button data-category="Tools">
            Tools
        </button>

        <button data-category="Others">
            Others
        </button>

    </div>


    <div id="statusMessage">
        🔄 Loading products...
    </div>


    <div
        class="products"
        id="productList"
    ></div>

</div>


<!-- CART BUTTON -->

<div
    class="cart"
    id="cartButton"
>
    🛒 Cart (0)
</div>


<!-- CART PANEL -->

<div
    class="cart-panel"
    id="cartPanel"
>

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <hr>

    <h3>
        Total: ₱<span id="cartTotal">0.00</span>
    </h3>

    <button
        class="close-cart"
        onclick="closeCart()"
    >
        Close
    </button>

</div>


<script>

const SUPABASE_URL =
    "https://djeqfrifhqcpfxccotdl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MAi_oJyKtuW1sM9YddWMMA_7tXcH1rP";


let cart = [];

let allProducts = [];

let selectedCategory = "All";


const productList =
    document.getElementById("productList");

const statusMessage =
    document.getElementById("statusMessage");

const cartButton =
    document.getElementById("cartButton");

const cartPanel =
    document.getElementById("cartPanel");

const cartItems =
    document.getElementById("cartItems");

const cartTotal =
    document.getElementById("cartTotal");

const searchInput =
    document.getElementById("searchInput");


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

    statusMessage.textContent =
        "🔄 Loading products...";


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/products" +
                "?select=*" +
                "&order=created_at.desc",
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Supabase error:",
                errorText
            );

            throw new Error(
                "Supabase returned " +
                response.status
            );
        }


        allProducts =
            await response.json();


        console.log(
            "Products loaded:",
            allProducts
        );


        if (
            !allProducts ||
            allProducts.length === 0
        ) {

            statusMessage.textContent =
                "📦 No products available.";

            productList.innerHTML = "";

            return;
        }


        statusMessage.textContent = "";

        filterProducts();

    } catch (error) {

        console.error(
            "Product loading error:",
            error
        );


        statusMessage.textContent =
            "❌ Unable to load products.";
    }
}


/* =========================
   FILTER PRODUCTS
========================= */

function filterProducts() {

    const searchText =
        searchInput.value
            .toLowerCase()
            .trim();


    const filteredProducts =
        allProducts.filter(
            function(product) {

                const categoryMatch =
                    selectedCategory === "All" ||
                    (
                        product.category &&
                        product.category
                            .toLowerCase() ===
                        selectedCategory
                            .toLowerCase()
                    );


                const searchableText =
                    (
                        (product.brand || "") +
                        " " +
                        (product.name || "") +
                        " " +
                        (product.description || "") +
                        " " +
                        (product.category || "")
                    ).toLowerCase();


                const searchMatch =
                    searchableText.includes(
                        searchText
                    );


                return (
                    categoryMatch &&
                    searchMatch
                );
            }
        );


    displayProducts(
        filteredProducts
    );
}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(products) {

    productList.innerHTML = "";


    if (products.length === 0) {

        productList.innerHTML = `
            <div class="no-results">
                🔍 No products found.
            </div>
        `;

        return;
    }


    products.forEach(
        function(product) {

            const price =
                Number(
                    product.price || 0
                );


            const stock =
                Number(
                    product.stock || 0
                );


            const card =
                document.createElement("div");

            card.className =
                "product";


            let imageHTML = "";


            if (product.image) {

                imageHTML = `
                    <img
                        class="product-image"
                        src="${product.image}"
                        alt="${product.name || "Product"}"
                    >
                `;

            } else {

                imageHTML = `
                    <div class="product-image">
                        Product Image
                    </div>
                `;
            }


            const stockHTML =
                stock > 0
                ? `
                    <div class="stock">
                        🟢 ${stock} available
                    </div>
                  `
                : `
                    <div class="stock out-stock">
                        🔴 Out of stock
                    </div>
                  `;


            card.innerHTML = `

                ${imageHTML}

                <strong>
                    ${product.brand || ""}
                </strong>

                <h3>
                    ${product.name || ""}
                </h3>

                ${
                    product.category
                    ? `
                    <div class="category-label">
                        ${product.category}
                    </div>
                    `
                    : ""
                }

                <p>
                    ${product.description || ""}
                </p>

                <div class="price">
                    ₱${price.toFixed(2)}
                    / ${product.unit || "Piece"}
                </div>

                ${stockHTML}

                <button
                    class="add-cart"
                    type="button"
                    ${stock <= 0 ? "disabled" : ""}
                >
                    ${
                        stock > 0
                        ? "Add to Cart"
                        : "Out of Stock"
                    }
                </button>

            `;


            const addButton =
                card.querySelector(
                    ".add-cart"
                );


            if (stock > 0) {

                addButton.addEventListener(
                    "click",
                    function() {

                        addToCart(product);

                    }
                );
            }


            productList.appendChild(card);

        }
    );
}


/* =========================
   CATEGORY BUTTONS
========================= */

document
    .querySelectorAll(
        "#categoryButtons button"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    selectedCategory =
                        this.dataset.category;


                    document
                        .querySelectorAll(
                            "#categoryButtons button"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    filterProducts();

                }
            );

        }
    );


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    function() {

        filterProducts();

    }
);


/* =========================
   ADD TO CART
========================= */

function addToCart(product) {

    const existing =
        cart.find(
            function(item) {

                return item.id === product.id;

            }
        );


    if (existing) {

        if (
            existing.quantity >=
            Number(product.stock || 0)
        ) {

            alert(
                "⚠️ You have reached the available stock."
            );

            return;
        }


        existing.quantity++;

    } else {

        cart.push({

            id: product.id,

            name: product.name,

            price:
                Number(
                    product.price || 0
                ),

            quantity: 1,

            stock:
                Number(
                    product.stock || 0
                )
        });
    }


    updateCart();
}


/* =========================
   OPEN CART
========================= */

cartButton.addEventListener(
    "click",
    function() {

        cartPanel.style.display =
            "block";

    }
);


/* =========================
   CLOSE CART
========================= */

window.closeCart =
    function() {

        cartPanel.style.display =
            "none";

    };


/* =========================
   CHANGE QUANTITY
========================= */

window.changeQuantity =
    function(id, amount) {

        const item =
            cart.find(
                function(item) {

                    return item.id === id;

                }
            );


        if (!item) {
            return;
        }


        if (
            amount > 0 &&
            item.quantity >= item.stock
        ) {

            alert(
                "⚠️ Maximum available stock reached."
            );

            return;
        }


        item.quantity += amount;


        if (item.quantity <= 0) {

            cart =
                cart.filter(
                    function(item) {

                        return item.id !== id;

                    }
                );
        }


        updateCart();

    };


/* =========================
   REMOVE ITEM
========================= */

window.removeItem =
    function(id) {

        cart =
            cart.filter(
                function(item) {

                    return item.id !== id;

                }
            );


        updateCart();

    };


/* =========================
   UPDATE CART
========================= */

function updateCart() {

    cartItems.innerHTML = "";


    let total = 0;

    let itemCount = 0;


    if (cart.length === 0) {

        cartItems.innerHTML = `
            <p style="
                text-align:center;
                padding:20px;
                color:#777;
            ">
                Your cart is empty.
            </p>
        `;
    }


    cart.forEach(
        function(item) {

            const subtotal =
                item.price *
                item.quantity;


            total += subtotal;

            itemCount +=
                item.quantity;


            cartItems.innerHTML += `

                <div class="cart-item">

                    <strong>
                        ${item.name}
                    </strong>

                    <br>

                    ₱${item.price.toFixed(2)}

                    <div class="quantity">

                        <button
                            onclick="
                                changeQuantity(
                                    ${item.id},
                                    -1
                                )
                            "
                        >
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="
                                changeQuantity(
                                    ${item.id},
                                    1
                                )
                            "
                        >
                            +
                        </button>

                        <button
                            class="remove"
                            onclick="
                                removeItem(
                                    ${item.id}
                                )
                            "
                        >
                            🗑️
                        </button>

                    </div>

                    <div>
                        Subtotal:
                        ₱${subtotal.toFixed(2)}
                    </div>

                </div>

            `;
        }
    );


    cartTotal.textContent =
        total.toFixed(2);


    cartButton.textContent =
        "🛒 Cart (" +
        itemCount +
        ")";
}


/* =========================
   START
========================= */

loadProducts();

</script>


<footer style="
    text-align:center;
    padding:30px 20px;
    margin-top:30px;
    background:#1f2937;
    color:white;
">

    <a
        href="seller.html"
        style="
            color:white;
            text-decoration:none;
            font-size:14px;
        "
    >
        🔐 Seller / Admin
    </a>

</footer>

</body>
</html>
